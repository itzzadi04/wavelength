<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wavelength — Chat on frequency</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          void: "#14171a",
          panel: "#1c2024",
          panelRaised: "#23282d",
          inset: "#101315",
          line: "#2c3237",
          signal: "#ff6b35",
          amber: "#ffb347",
          faint: "#565c64",
          muted: "#8a8f98",
          onlineGreen: "#4ade80",
          errorRed: "#ef4a5f",
        },
        fontFamily: {
          display: ["Space Grotesk", "sans-serif"],
          body: ["Inter", "sans-serif"],
          mono: ["JetBrains Mono", "monospace"],
        },
      },
    },
  };
</script>

<style>
  body {
    background-color: #14171a;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(255, 107, 53, 0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(255, 179, 71, 0.05), transparent 45%);
  }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2c3237; border-radius: 8px; }

  /* Signature element: animated waveform, used to mark "live" moments */
  .waveform { display: inline-flex; align-items: center; gap: 2px; height: 14px; }
  .waveform span {
    width: 2px;
    background: #ff6b35;
    border-radius: 1px;
    animation: wave 1.1s ease-in-out infinite;
  }
  .waveform span:nth-child(1) { height: 40%; animation-delay: 0s; }
  .waveform span:nth-child(2) { height: 100%; animation-delay: 0.15s; }
  .waveform span:nth-child(3) { height: 65%; animation-delay: 0.3s; }
  .waveform span:nth-child(4) { height: 85%; animation-delay: 0.45s; }
  .waveform span:nth-child(5) { height: 30%; animation-delay: 0.6s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.4); opacity: 0.6; }
    50% { transform: scaleY(1); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .waveform span { animation: none; transform: scaleY(0.8); }
  }

  .msg-in {
    animation: msg-in 0.15s ease-out;
  }
  @keyframes msg-in {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

<body class="font-body text-gray-100 h-screen w-screen overflow-hidden">

  <!-- ===================== ONBOARDING SCREEN ===================== -->
  <section id="onboarding-screen" class="h-full w-full flex items-center justify-center p-6">
    <div class="w-full max-w-sm bg-panel border border-line rounded-2xl p-8 shadow-2xl">
      <div class="flex items-center gap-2 mb-3">
        <span class="waveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
        <h1 class="font-display text-2xl font-bold tracking-tight">Wavelength</h1>
      </div>
      <p class="text-sm text-muted leading-relaxed mb-7">
        Enter a username to register a new profile, or log in with one you already use.
      </p>

      <label for="username-input" class="block font-mono text-[11px] uppercase tracking-wider text-faint mb-1">
        Username
      </label>
      <input
        id="username-input"
        type="text"
        placeholder="e.g. night-owl"
        autocomplete="off"
        class="w-full bg-inset border border-line rounded-md px-3.5 py-3 text-[15px] text-gray-100 mb-4 focus:outline-none focus:border-signal transition-colors"
      />

      <div class="flex gap-3">
        <button
          id="login-btn"
          class="flex-1 bg-panelRaised border border-line hover:border-muted rounded-md py-3 font-display font-semibold text-sm transition-colors"
        >
          Log In
        </button>
        <button
          id="register-btn"
          class="flex-1 bg-signal hover:brightness-110 active:scale-[0.98] text-[#1a1300] rounded-md py-3 font-display font-semibold text-sm transition-all"
        >
          Register Account
        </button>
      </div>

      <p id="onboarding-status" class="text-xs text-muted mt-4 hidden"></p>
    </div>
  </section>

  <!-- ===================== MAIN APPLICATION BOARD ===================== -->
  <section id="app-board" class="hidden h-full w-full grid grid-cols-[280px_1fr]">

    <!-- Sidebar -->
    <aside class="bg-panel border-r border-line flex flex-col p-5 gap-5 overflow-y-auto">

      <!-- Profile -->
      <div class="flex items-center gap-3">
        <div id="avatar" class="w-10 h-10 min-w-[40px] rounded-full bg-gradient-to-br from-signal to-amber flex items-center justify-center font-display font-bold text-[13px] text-[#1a1300]">
          --
        </div>
        <div class="min-w-0 flex-1">
          <div id="profile-name" class="font-display font-semibold text-[14.5px] truncate">—</div>
          <div class="flex items-center gap-1.5 text-[12px] font-mono text-onlineGreen">
            <span class="w-1.5 h-1.5 rounded-full bg-onlineGreen shadow-[0_0_6px_#4ade80]"></span>
            On frequency
          </div>
        </div>
      </div>

      <!-- Create room -->
      <div class="flex flex-col gap-2 pt-4 border-t border-line">
        <h2 class="font-mono text-[11px] uppercase tracking-wider text-faint">Rooms</h2>

        <button
          id="show-create-room-btn"
          class="bg-panelRaised border border-dashed border-line hover:border-signal rounded-md px-3 py-2.5 text-[13.5px] text-left transition-colors"
        >
          + Create new room
        </button>

        <div id="create-room-dialog" class="hidden flex-col gap-2 bg-inset border border-line rounded-md p-3">
          <input
            id="new-room-input"
            type="text"
            placeholder="Room name"
            class="bg-panel border border-line rounded-md px-2.5 py-2 text-[13.5px] focus:outline-none focus:border-signal"
          />
          <div class="flex gap-2">
            <button id="confirm-create-room-btn" class="flex-1 bg-signal text-[#1a1300] rounded-md py-2 text-[13px] font-semibold hover:brightness-110">
              Create &amp; join
            </button>
            <button id="cancel-create-room-btn" class="border border-line text-muted rounded-md px-3 py-2 text-[13px] hover:text-gray-100">
              Cancel
            </button>
          </div>
        </div>

        <!-- Join room -->
        <div class="flex flex-col gap-2 bg-inset border border-line rounded-md p-3 mt-1">
          <label for="join-room-input" class="font-mono text-[11px] uppercase tracking-wider text-faint">
            Enter room ID
          </label>
          <div class="flex gap-2">
            <input
              id="join-room-input"
              type="text"
              placeholder="e.g. general"
              class="flex-1 min-w-0 bg-panel border border-line rounded-md px-2.5 py-2 text-[13.5px] focus:outline-none focus:border-signal"
            />
            <button id="join-room-btn" class="bg-signal text-[#1a1300] rounded-md px-3 py-2 text-[13px] font-semibold hover:brightness-110">
              Join
            </button>
          </div>
        </div>
      </div>

      <div id="active-room-tag" class="hidden flex-col gap-1 pt-4 border-t border-line">
        <span class="font-mono text-[11px] uppercase tracking-wider text-faint">Currently on</span>
        <span id="active-room-label" class="font-mono text-signal text-sm">—</span>
      </div>
    </aside>

    <!-- Main chat panel -->
    <main class="flex flex-col h-full min-w-0">

      <!-- Placeholder (no room selected) -->
      <div id="no-room-placeholder" class="flex-1 flex items-center justify-center">
        <div class="flex flex-col items-center gap-3.5 text-center max-w-sm text-muted">
          <span class="waveform" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></span>
          <h2 class="font-display text-gray-100 text-xl m-0">No room selected</h2>
          <p class="text-sm leading-relaxed m-0">Select or join a room to start chatting.</p>
        </div>
      </div>

      <!-- Active room view -->
      <div id="active-room-view" class="hidden flex-col h-full">
        <header class="flex items-center justify-between px-6 py-4 border-b border-line">
          <div>
            <span class="block font-mono text-[11px] uppercase tracking-wider text-faint">Channel</span>
            <h2 id="room-header-id" class="font-display text-xl text-signal mt-0.5">#—</h2>
          </div>
          <button id="leave-room-btn" class="border border-errorRed text-errorRed hover:bg-errorRed/10 rounded-md px-3.5 py-2 text-[13px] font-medium transition-colors">
            Leave Room
          </button>
        </header>

        <div id="message-log" class="flex-1 overflow-y-auto px-6 py-5 flex flex-col gap-3 scroll-smooth">
          <p id="log-empty-note" class="m-auto text-faint text-[13.5px]">No messages yet — say something to break the silence.</p>
        </div>

        <form id="composer-form" class="flex gap-2.5 px-6 py-4 border-t border-line">
          <input
            id="composer-input"
            type="text"
            placeholder="Send a message…"
            autocomplete="off"
            class="flex-1 bg-inset border border-line rounded-lg px-4 py-3 text-[14.5px] focus:outline-none focus:border-signal"
          />
          <button
            id="composer-send-btn"
            type="submit"
            class="bg-signal disabled:opacity-50 text-[#1a1300] rounded-lg px-5 font-display font-semibold text-sm hover:brightness-110"
          >
            Send
          </button>
        </form>
      </div>
    </main>
  </section>

<script>
  // ============================================================
  // Config
  // ============================================================
  const API_BASE_URL = "http://localhost:5000/api";
  const SOCKET_SERVER_URL = "http://localhost:5000";

  // ============================================================
  // Global state
  // ============================================================
  let socket = null;        // globally-scoped socket instance
  let currentUser = null;   // { _id, name }
  let activeRoomId = null;  // currently joined room id, or null

  // ============================================================
  // DOM references
  // ============================================================
  const onboardingScreen = document.getElementById("onboarding-screen");
  const appBoard = document.getElementById("app-board");
  const onboardingStatus = document.getElementById("onboarding-status");

  const usernameInput = document.getElementById("username-input");
  const loginBtn = document.getElementById("login-btn");
  const registerBtn = document.getElementById("register-btn");

  const avatarEl = document.getElementById("avatar");
  const profileNameEl = document.getElementById("profile-name");

  const showCreateRoomBtn = document.getElementById("show-create-room-btn");
  const createRoomDialog = document.getElementById("create-room-dialog");
  const newRoomInput = document.getElementById("new-room-input");
  const confirmCreateRoomBtn = document.getElementById("confirm-create-room-btn");
  const cancelCreateRoomBtn = document.getElementById("cancel-create-room-btn");

  const joinRoomInput = document.getElementById("join-room-input");
  const joinRoomBtn = document.getElementById("join-room-btn");

  const activeRoomTag = document.getElementById("active-room-tag");
  const activeRoomLabel = document.getElementById("active-room-label");

  const noRoomPlaceholder = document.getElementById("no-room-placeholder");
  const activeRoomView = document.getElementById("active-room-view");
  const roomHeaderId = document.getElementById("room-header-id");
  const leaveRoomBtn = document.getElementById("leave-room-btn");

  const messageLog = document.getElementById("message-log");
  const logEmptyNote = document.getElementById("log-empty-note");

  const composerForm = document.getElementById("composer-form");
  const composerInput = document.getElementById("composer-input");

  // ============================================================
  // Onboarding: register / log in
  // ============================================================
  function setOnboardingStatus(text) {
    if (!text) {
      onboardingStatus.classList.add("hidden");
      onboardingStatus.textContent = "";
      return;
    }
    onboardingStatus.textContent = text;
    onboardingStatus.classList.remove("hidden");
  }

  function setAuthButtonsDisabled(disabled) {
    loginBtn.disabled = disabled;
    registerBtn.disabled = disabled;
    loginBtn.classList.toggle("opacity-50", disabled);
    registerBtn.classList.toggle("opacity-50", disabled);
  }

  async function registerUser(username) {
    const res = await fetch(`${API_BASE_URL}/settingusername`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username }),
    });
    if (!res.ok) {
      let msg = "Registration failed";
      try {
        const body = await res.json();
        msg = body.error || body.msg || msg;
      } catch (_e) {
        // response wasn't JSON — keep the generic message
      }
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return res.json(); // { user: { _id, name } }
  }

  function connectSocketAndIdentify(username) {
    // Tear down any stale connection before creating a fresh one.
    if (socket) {
      socket.disconnect();
      socket = null;
    }

    socket = io(SOCKET_SERVER_URL);

    socket.on("connect", () => {
      socket.emit("identify", username);
    });

    socket.on("identified", (data) => {
      currentUser = data.user;
      enterAppBoard();
    });

    socket.on("connect_error", () => {
      setAuthButtonsDisabled(false);
      setOnboardingStatus("");
      alert("Couldn't reach the server. Check your connection and try again.");
    });

    // Global error handler — stays attached for the whole session.
    socket.on("error", (errObj) => {
      setAuthButtonsDisabled(false);
      setOnboardingStatus("");
      alert(errObj && errObj.msg ? errObj.msg : "Something went wrong.");
    });
  }

  registerBtn.addEventListener("click", async () => {
    const username = usernameInput.value.trim();
    if (!username) {
      alert("Enter a username first.");
      return;
    }
    setAuthButtonsDisabled(true);
    setOnboardingStatus("Registering…");
    try {
      await registerUser(username);
      setOnboardingStatus("Connecting…");
      connectSocketAndIdentify(username);
    } catch (err) {
      setAuthButtonsDisabled(false);
      setOnboardingStatus("");
      console.error("Registration error:", err);
      if (err.status === 409) {
        alert("That username is already taken.");
      } else {
        alert(err.message || "Couldn't register. Please try again.");
      }
    }
  });

  loginBtn.addEventListener("click", () => {
    const username = usernameInput.value.trim();
    if (!username) {
      alert("Enter a username first.");
      return;
    }
    setAuthButtonsDisabled(true);
    setOnboardingStatus("Connecting…");
    connectSocketAndIdentify(username);
  });

  usernameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      loginBtn.click();
    }
  });

  // ============================================================
  // Transition to main app board
  // ============================================================
  function enterAppBoard() {
    setAuthButtonsDisabled(false);
    setOnboardingStatus("");
    onboardingScreen.classList.add("hidden");
    appBoard.classList.remove("hidden");
    appBoard.classList.add("grid");

    profileNameEl.textContent = currentUser.name;
    avatarEl.textContent = currentUser.name.slice(0, 2).toUpperCase();

    // Room-scoped listeners are attached once, filtered by activeRoomId at render time.
    socket.on("chatMessage", handleIncomingMessage);
    socket.on("userJoined", (data) => handlePresenceEvent(data, "joined"));
    socket.on("userLeft", (data) => handlePresenceEvent(data, "left"));
  }

  // ============================================================
  // Room management
  // ============================================================
  showCreateRoomBtn.addEventListener("click", () => {
    createRoomDialog.classList.toggle("hidden");
    createRoomDialog.classList.toggle("flex");
    newRoomInput.focus();
  });

  cancelCreateRoomBtn.addEventListener("click", () => {
    createRoomDialog.classList.add("hidden");
    createRoomDialog.classList.remove("flex");
    newRoomInput.value = "";
  });

  confirmCreateRoomBtn.addEventListener("click", async () => {
    const roomid = newRoomInput.value.trim();
    if (!roomid) {
      alert("Give the room a name.");
      return;
    }
    confirmCreateRoomBtn.disabled = true;
    try {
      const res = await fetch(`${API_BASE_URL}/createchatroom`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ roomid }),
      });
      if (!res.ok) throw new Error("Room creation failed");

      enterRoom(roomid);
      createRoomDialog.classList.add("hidden");
      createRoomDialog.classList.remove("flex");
      newRoomInput.value = "";
    } catch (err) {
      alert("Couldn't create that room. Try a different name.");
    } finally {
      confirmCreateRoomBtn.disabled = false;
    }
  });

  joinRoomBtn.addEventListener("click", () => {
    const roomid = joinRoomInput.value.trim();
    if (!roomid) {
      alert("Enter a room ID first.");
      return;
    }
    enterRoom(roomid);
    joinRoomInput.value = "";
  });

  joinRoomInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      joinRoomBtn.click();
    }
  });

  function enterRoom(roomId) {
    if (!socket || !currentUser) return;

    activeRoomId = roomId;
    socket.emit("joinRoom", roomId, currentUser._id);

    // Reset message log for the new room.
    messageLog.innerHTML = "";
    messageLog.appendChild(logEmptyNote);
    logEmptyNote.classList.remove("hidden");

    roomHeaderId.textContent = `#${roomId}`;
    activeRoomLabel.textContent = `#${roomId}`;
    activeRoomTag.classList.remove("hidden");
    activeRoomTag.classList.add("flex");

    noRoomPlaceholder.classList.add("hidden");
    activeRoomView.classList.remove("hidden");
    activeRoomView.classList.add("flex");

    composerInput.focus();
  }

  leaveRoomBtn.addEventListener("click", () => {
    if (!socket || !currentUser || !activeRoomId) return;

    socket.emit("leaveRoom", activeRoomId, currentUser._id);
    activeRoomId = null;

    activeRoomTag.classList.add("hidden");
    activeRoomTag.classList.remove("flex");

    activeRoomView.classList.add("hidden");
    activeRoomView.classList.remove("flex");
    noRoomPlaceholder.classList.remove("hidden");

    messageLog.innerHTML = "";
  });

  // ============================================================
  // Messaging
  // ============================================================
  composerForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = composerInput.value.trim();
    if (!text || !activeRoomId || !socket) return;

    socket.emit("chatMessage", activeRoomId, text);
    composerInput.value = "";
  });

  function formatTime(iso) {
    try {
      const d = iso ? new Date(iso) : new Date();
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch (_e) {
      return "";
    }
  }

  function handlePresenceEvent(data, action) {
    console.log(`[user ${action}]`, data, "activeRoomId:", activeRoomId);
    if (!activeRoomId) return;

    logEmptyNote.classList.add("hidden");

    const row = document.createElement("div");
    row.className = "flex justify-center msg-in";

    const pill = document.createElement("span");
    pill.className = "font-mono text-[11.5px] text-muted bg-inset border border-line rounded-full px-3 py-1";
    const shortId = data && data.userId ? String(data.userId).slice(-6) : "someone";
    pill.textContent = `User …${shortId} ${action} the room`;

    row.appendChild(pill);
    messageLog.appendChild(row);
    messageLog.scrollTo({ top: messageLog.scrollHeight, behavior: "smooth" });
  }

  function handleIncomingMessage(msgObj) {
    console.log("[chatMessage received]", msgObj, "activeRoomId:", activeRoomId);

    // NOTE: msgObj.chatroom is the room's internal MongoDB ObjectId, but the
    // client only ever knows the human-typed `roomid` string (activeRoomId).
    // These two values will never be equal, so we don't compare them directly.
    // Instead we trust Socket.io's own room scoping: the server only emits
    // 'chatMessage' to sockets that have joined that room, so any message we
    // receive while a room is active belongs to that room.
    if (!activeRoomId) return;

    logEmptyNote.classList.add("hidden");

    const isOwn = currentUser && msgObj.createdby && msgObj.createdby._id === currentUser._id;

    const row = document.createElement("div");
    row.className = `flex ${isOwn ? "justify-end" : "justify-start"} msg-in`;

    const bubble = document.createElement("div");
    bubble.className = isOwn
      ? "max-w-[62%] px-3.5 py-2.5 rounded-2xl rounded-tr-sm bg-signal text-[#1a1300] flex flex-col gap-0.5"
      : "max-w-[62%] px-3.5 py-2.5 rounded-2xl rounded-tl-sm bg-panelRaised border border-line flex flex-col gap-0.5";

    if (!isOwn) {
      const authorEl = document.createElement("span");
      authorEl.className = "font-mono text-[11px] text-amber font-medium";
      authorEl.textContent = (msgObj.createdby && msgObj.createdby.name) || "Unknown";
      bubble.appendChild(authorEl);
    } else {
      const authorEl = document.createElement("span");
      authorEl.className = "font-mono text-[11px] text-[#1a1300]/70 font-medium";
      authorEl.textContent = (msgObj.createdby && msgObj.createdby.name) || currentUser.name;
      bubble.appendChild(authorEl);
    }

    const textEl = document.createElement("p");
    textEl.className = "m-0 text-[14.5px] leading-snug break-words";
    textEl.textContent = msgObj.message;
    bubble.appendChild(textEl);

    const timeEl = document.createElement("span");
    timeEl.className = `self-end font-mono text-[10.5px] ${isOwn ? "text-[#1a1300]/65" : "opacity-60"}`;
    timeEl.textContent = formatTime(msgObj.createdAt);
    bubble.appendChild(timeEl);

    row.appendChild(bubble);
    messageLog.appendChild(row);

    messageLog.scrollTo({ top: messageLog.scrollHeight, behavior: "smooth" });
  }
</script>
</body>
</html>
